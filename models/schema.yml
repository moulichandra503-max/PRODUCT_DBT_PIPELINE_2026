version: 2

models:
  - name: stg_products
    description: Cleaned and standardized product data from the raw source.
    columns:
      - name: PRODUCT_ID
        description: Unique identifier for each product.
        tests: [not_null, unique]
      - name: PRODUCT_NAME
        description: Trimmed product name.
        tests: [not_null]
      - name: CATEGORY
        description: Uppercased and trimmed product category.
        tests: [not_null]
      - name: SUBCATEGORY
        description: Uppercased and trimmed product subcategory.
        tests: [not_null]
      - name: BRAND
        description: Trimmed brand name.
        tests: [not_null]
      - name: PRICE
        description: Unit price of the product.
        tests: [not_null]
      - name: QUANTITY
        description: Quantity available or sold.
        tests: [not_null]
      - name: DISCOUNT
        description: Discount rate applied (0 to 1).
        tests: [not_null]
      - name: GROSS_VALUE
        description: Calculated as PRICE * QUANTITY, rounded to 2 decimals.
        tests: [not_null]
      - name: NET_VALUE
        description: Calculated as PRICE * QUANTITY * (1 - DISCOUNT), rounded to 2 decimals.
        tests: [not_null]

  - name: dim_products
    description: Product dimension table enriched with price band classification.
    columns:
      - name: PRODUCT_ID
        description: Unique identifier for each product.
        tests: [not_null, unique]
      - name: PRODUCT_NAME
        description: Product name.
        tests: [not_null]
      - name: CATEGORY
        description: Product category.
        tests: [not_null]
      - name: SUBCATEGORY
        description: Product subcategory.
        tests: [not_null]
      - name: BRAND
        description: Brand name.
        tests: [not_null]
      - name: PRICE
        description: Unit price.
        tests: [not_null]
      - name: QUANTITY
        description: Quantity.
        tests: [not_null]
      - name: DISCOUNT
        description: Discount rate.
        tests: [not_null]
      - name: GROSS_VALUE
        description: Gross value before discount.
        tests: [not_null]
      - name: NET_VALUE
        description: Net value after discount.
        tests: [not_null]
      - name: PRICE_BAND
        description: "Price classification: LOW (<50), MEDIUM (50-199), HIGH (200+)."
        tests: [not_null]

  - name: product_summary
    description: Aggregated product metrics grouped by category.
    columns:
      - name: CATEGORY
        description: Product category.
        tests: [not_null]
      - name: PRODUCT_COUNT
        description: Number of products in the category.
        tests: [not_null]
      - name: TOTAL_QUANTITY
        description: Sum of quantities across all products in the category.
        tests: [not_null]
      - name: TOTAL_GROSS_VALUE
        description: Sum of gross values in the category.
        tests: [not_null]
      - name: TOTAL_NET_VALUE
        description: Sum of net values in the category.
        tests: [not_null]
      - name: AVERAGE_PRICE
        description: Average unit price in the category.
        tests: [not_null]
